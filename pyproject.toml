[project]
name = "shelflife-memory"
version = "0.1.0"
description = "MCP memory server that re-checks remembered facts when they are due"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
]

[project.scripts]
shelflife-memory = "shelflife.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.9",
    "pytest>=9.1",
    "ruff>=0.17",
]
# Eval-only dependencies (CLAUDE.md); the package itself needs none of them.
eval = [
    "packaging>=24",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "eval"]

[tool.uv.build-backend]
module-name = "shelflife"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so tests can import eval/
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
