name: PR checks

# Both jobs compare the PR's merge commit (HEAD) with its first parent, the base branch,
# so they see exactly what merging the PR would change. labeled and unlabeled re-run
# them when the maintainer adds or removes deps-approved.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Dependencies and uv.lock unchanged, or the PR has the deps-approved label
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'deps-approved') }}
        shell: python3 {0}
        run: |
          import os, subprocess, sys, tomllib

          def deps(rev):
              text = subprocess.run(
                  ["git", "show", f"{rev}:pyproject.toml"],
                  check=True, capture_output=True, text=True,
              ).stdout
              data = tomllib.loads(text)
              project = data.get("project", {})
              return {
                  "project.dependencies": project.get("dependencies"),
                  "project.optional-dependencies": project.get("optional-dependencies"),
                  "dependency-groups": data.get("dependency-groups"),
                  "build-system": data.get("build-system"),
                  "tool.uv": data.get("tool", {}).get("uv"),
              }

          def lock(rev):
              shown = subprocess.run(
                  ["git", "show", f"{rev}:uv.lock"], capture_output=True, text=True
              )
              return shown.stdout if shown.returncode == 0 else None

          before, after = deps("HEAD^1"), deps("HEAD")
          changed = [key for key in before if before[key] != after[key]]
          for key in changed:
              print(f"{key}:\n  before: {before[key]}\n  after:  {after[key]}")
          # The lock file pins every package installed, so a change to it is a dependency
          # change even when pyproject.toml is untouched (an upgrade, a new transitive pin).
          if lock("HEAD^1") != lock("HEAD"):
              changed.append("uv.lock")
              print("uv.lock changed.")
          if not changed:
              print("Dependencies in pyproject.toml and uv.lock are unchanged.")
              sys.exit(0)
          if os.environ["APPROVED"] == "true":
              print("Changed, and the PR has the deps-approved label.")
              sys.exit(0)
          print("::error::Dependencies in pyproject.toml or uv.lock changed. The maintainer approves by adding the deps-approved label.")
          sys.exit(1)

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Changed lines, excluding tests, fixtures, eval data, uv.lock and deleted files (limit 600)
        shell: python3 {0}
        run: |
          import os, re, subprocess, sys

          LIMIT = 600
          EXCLUDED = re.compile(r"^(tests/|eval/data/|uv\.lock$)|(^|/)fixtures/")
          # A file the PR deletes entirely needs no line-by-line review, so it is not counted.
          removed_files = set(subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=D", "-M", "-z", "HEAD^1", "HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.split("\0"))
          # -z writes "added\tdeleted\tpath\0", or for a rename "added\tdeleted\t\0old\0new\0",
          # so a moved file counts only the lines that changed in it.
          fields = subprocess.run(
              ["git", "diff", "--numstat", "-M", "-z", "HEAD^1", "HEAD"],
              check=True, capture_output=True, text=True,
          ).stdout.split("\0")
          rows, gone = [], []
          while len(fields) > 1:
              added, deleted, path = fields.pop(0).split("\t", 2)
              if not path:
                  path = fields[1]
                  del fields[:2]
              if added == "-" or EXCLUDED.search(path):  # binary or excluded
                  continue
              if path in removed_files:  # shown below, so a large deletion stays visible
                  gone.append((int(deleted), path))
                  continue
              rows.append((int(added) + int(deleted), path))
          total = sum(n for n, _ in rows)
          report = [f"Changed lines (excluding tests, fixtures, eval data, uv.lock and deleted files): {total} (limit {LIMIT})", ""]
          report += [f"{n:6} {path}" for n, path in sorted(rows, reverse=True)]
          report += [f"deleted, not counted: {n} lines {path}" for n, path in sorted(gone, reverse=True)]
          print("\n".join(report))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("```\n" + "\n".join(report) + "\n```\n")
          if total > LIMIT:
              print(f"::error::{total} changed lines is above the limit of {LIMIT}. Split the PR.")
              sys.exit(1)
