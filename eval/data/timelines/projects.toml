# Candidate projects for the M5a release timelines (D11).
#
# The maintainer cuts this list to about 50 PyPI projects and 20 GitHub repositories and
# gives each kept project a volatility label (fast, medium or slow) while cutting, before
# any data is collected, so the labels stay blind to the data. The collector refuses to
# run while a label is empty. The labels are the maintainer's: Claude never fills them.
#
# How the candidates were chosen:
# - Fields that release at very different paces: AI and LLM tooling, web frameworks and
#   clients, data and science libraries, developer tools, a cloud SDK, long-standing
#   utilities, and server and command-line software.
# - PyPI projects first published before 2024, so the latest version on the replay's
#   first day is known; and the projects the maintainer's own memory checks (mcp,
#   claude-agent-sdk, Hindsight, Graphiti), whatever their age.
# - GitHub repositories that publish GitHub Releases, which the github_release verifier
#   reads, under one tag series: no monorepos whose releases are per-package tags. No
#   repository is the same project as a PyPI entry.
# - No repository that patches several release lines in parallel, or whose latest is
#   set by hand (the maintainer's cut, from each repository's last 100 releases and the
#   collector's first run): there "the stable release created last" keeps jumping
#   between lines, or is not what GitHub shows as latest.
# - No repository whose created_at values moved after publishing so often that its past
#   cannot be rebuilt (ollama, cut after an outside review; D11).
# - Alphabetical, with no release counts, dates or guessed volatility.
#
# `tag` (GitHub only, optional) is a regular expression a release's tag must match
# (re.search), for a repository that also publishes releases of other products: the
# collector and latest_on() ignore every release whose tag does not match. Use '^v\d'
# (or '^\d' for tags without a "v"), not '^v', which also matches "vscode-typescript/".
#
# The collector warns about tags with several prefixes, about a latest release that our
# rules disagree with, and about a latest release outside the tag pattern.

